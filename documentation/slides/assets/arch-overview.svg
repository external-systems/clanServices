<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <!-- inventory -->
  <rect x="30" y="30" width="220" height="80" rx="6" fill="#eef2ff" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">inventory.nix</text>
  <text x="140" y="86" text-anchor="middle" font-size="14" fill="#111">declare machines + clusters</text>

  <line x1="252" y1="70" x2="316" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- clanServices -->
  <rect x="320" y="30" width="220" height="80" rx="6" fill="#e8f4ec" stroke="#333" stroke-width="1.5"/>
  <text x="430" y="62" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">clanServices</text>
  <text x="430" y="86" text-anchor="middle" font-size="14" fill="#111">this flake</text>

  <!-- Flux -->
  <rect x="30" y="170" width="220" height="70" rx="6" fill="#fdf3e3" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Flux</text>
  <text x="140" y="222" text-anchor="middle" font-size="14" fill="#111">GitOps day two</text>

  <!-- artifact flake -->
  <rect x="620" y="170" width="250" height="70" rx="6" fill="#fdf3e3" stroke="#333" stroke-width="1.5"/>
  <text x="745" y="198" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">artifact flake</text>
  <text x="745" y="222" text-anchor="middle" font-size="14" fill="#111">every version pinned</text>

  <!-- clusters -->
  <rect x="60" y="290" width="220" height="80" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
  <text x="170" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">k3s cluster</text>
  <text x="170" y="346" text-anchor="middle" font-size="14" fill="#111">CNCF distro</text>

  <rect x="340" y="290" width="220" height="80" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">rke2 cluster</text>
  <text x="450" y="346" text-anchor="middle" font-size="14" fill="#111">CIS-hardened default</text>

  <rect x="620" y="290" width="250" height="80" rx="6" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
  <text x="745" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">kubernetes cluster</text>
  <text x="745" y="346" text-anchor="middle" font-size="14" fill="#111">upstream kubeadm (reserved)</text>

  <!-- arrows clanServices to clusters -->
  <line x1="400" y1="110" x2="180" y2="286" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="110" x2="450" y2="286" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="110" x2="730" y2="286" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- dashed arrows Flux / artifact flake -->
  <line x1="170" y1="240" x2="170" y2="286" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="745" y1="240" x2="745" y2="286" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- mesh fabric bar -->
  <line x1="170" y1="370" x2="170" y2="418" stroke="#333" stroke-width="1.5"/>
  <line x1="450" y1="370" x2="450" y2="418" stroke="#333" stroke-width="1.5"/>
  <line x1="745" y1="370" x2="745" y2="418" stroke="#333" stroke-width="1.5"/>
  <rect x="60" y="420" width="810" height="50" rx="6" fill="#efe8f7" stroke="#333" stroke-width="1.5"/>
  <text x="465" y="451" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">ClusterMesh + private fleet fabric (BIRD/BGP)</text>
</svg>
