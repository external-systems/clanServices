<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- hub cluster -->
  <rect x="40" y="70" width="300" height="270" rx="8" fill="#e8f4ec" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">hub cluster</text>

  <rect x="60" y="120" width="260" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="190" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">flux-operator + FluxInstance</text>
  <text x="190" y="164" text-anchor="middle" font-size="13" fill="#333">self-managing after bootstrap</text>

  <text x="190" y="220" text-anchor="middle" font-size="14" fill="#111">holds spoke kubeconfigs</text>
  <text x="190" y="242" text-anchor="middle" font-size="14" fill="#111">as Sealed Secrets (D35)</text>
  <text x="190" y="286" text-anchor="middle" font-size="14" fill="#111">delivers workloads only —</text>
  <text x="190" y="308" text-anchor="middle" font-size="14" fill="#111">never installs Flux remotely (D28)</text>

  <!-- spoke A -->
  <rect x="470" y="50" width="390" height="150" rx="8" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
  <text x="665" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">spoke cluster A</text>
  <rect x="490" y="100" width="350" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="665" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">kube-api mirror Service</text>
  <text x="665" y="144" text-anchor="middle" font-size="13" fill="#333">ClusterMesh global (D30)</text>

  <!-- spoke B -->
  <rect x="470" y="240" width="390" height="150" rx="8" fill="#f4f6fb" stroke="#333" stroke-width="1.5"/>
  <text x="665" y="270" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">spoke cluster B</text>
  <rect x="490" y="290" width="350" height="56" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="665" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">kube-api mirror Service</text>
  <text x="665" y="334" text-anchor="middle" font-size="13" fill="#333">ClusterMesh global (D30)</text>

  <!-- delivery arrows -->
  <line x1="340" y1="150" x2="466" y2="128" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="403" y="112" text-anchor="middle" font-size="13" fill="#333">kubeConfig.secretRef</text>

  <line x1="340" y1="290" x2="466" y2="312" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="403" y="282" text-anchor="middle" font-size="13" fill="#333">kubeConfig.secretRef</text>

  <!-- DNS rewrite note on hub -->
  <text x="190" y="362" text-anchor="middle" font-size="13" fill="#333">CoreDNS: kubernetes.&lt;spoke&gt;.&lt;domain&gt; → mirror Service</text>

  <!-- clan hosts -->
  <rect x="40" y="410" width="300" height="70" rx="8" fill="#fdf3e3" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">clan hosts</text>
  <text x="190" y="460" text-anchor="middle" font-size="14" fill="#111">fleet-routing client / admin</text>

  <!-- BIRD/BGP fabric -->
  <line x1="190" y1="410" x2="190" y2="344" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="455" x2="450" y2="455" stroke="#333" stroke-width="1.5"/>
  <line x1="450" y1="455" x2="450" y2="125" stroke="#333" stroke-width="1.5"/>
  <line x1="450" y1="125" x2="466" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="315" x2="466" y2="315" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="447" text-anchor="middle" font-size="14" fill="#333">BIRD/BGP private fleet fabric</text>
</svg>
